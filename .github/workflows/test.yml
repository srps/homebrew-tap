name: Test cask

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-26
    steps:
      - name: Tap this checkout
        run: |
          brew tap "$GITHUB_REPOSITORY" "https://github.com/$GITHUB_REPOSITORY"
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          git fetch origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - run: brew style srps/tap
      # Before any trust: this is the command the README gives users.
      - name: Install and uninstall
        run: |
          brew install --cask srps/tap/conduit
          test -d /Applications/Conduit.app
          brew uninstall --cask srps/tap/conduit
      - run: brew trust --tap srps/tap
      # homebrew/core has an unrelated `conduit` formula. The tap keeps the
      # app's own name; users install it as srps/tap/conduit.
      - run: brew audit --cask --strict --online --except=token_conflicts srps/tap/conduit
